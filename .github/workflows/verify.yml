# CI for pipen: the full pre-commit hook suite, both charts (helm lint +
# template render + client-side parse), the pipen CLI (lockfile check +
# smoke), a kind e2e run that installs both charts and drives a pen through
# its lifecycle, and a full image build of devenv/ so a broken toolchain
# build is caught before it reaches the cluster.

name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pre-commit
        run: uv tool install pre-commit
      - name: Run all hooks on all files
        run: pre-commit run --all-files

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Chart changes must bump the chart version
        run: |
          # the Chart.yaml version bump is the release trigger for the
          # chart publish workflow, so a chart change without a bump
          # changes the installed chart silently
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # push to main: diff against the ref tip just before the push;
            # all zeros means the branch is new, so there is no base
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "new branch, no base sha, skipping"
              exit 0
            fi
          fi
          git fetch --no-tags --depth=1 origin "$base"
          charts=$(git diff --name-only FETCH_HEAD -- charts/ \
            | sed -n 's|charts/\([^/]*\)/.*|\1|p' | sort -u)
          if [ -z "$charts" ]; then
            echo "no chart changes"
            exit 0
          fi
          for chart in $charts; do
            git diff FETCH_HEAD -- "charts/$chart/Chart.yaml" \
              | grep -qE '^[+-]version:' \
              || { echo "chart $chart changed but its version was not bumped" >&2; exit 1; }
            echo "chart $chart version bump OK"
          done
      - name: Install helm
        run: |
          helm_version=3.16.4
          curl -fsSL "https://get.helm.sh/helm-v${helm_version}-linux-amd64.tar.gz" | tar xz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Lint the dev-namespace chart
        run: helm lint charts/dev-namespace --set dev=ci-checker
      - name: Template the chart and parse the rendered manifests
        run: |
          # offline: no cluster for kubectl --dry-run, so parse the rendered
          # output as multi-doc YAML and check the object count
          helm template ci-checker charts/dev-namespace \
            --set dev=ci-checker \
            --set 'authorizedKeys[0]=ssh-ed25519 AAAACIKEY ci-checker' \
            | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          assert len(docs) == 10, f"expected 10 manifests, got {len(docs)}"
          print(f"{len(docs)} manifests OK: " + ", ".join(d["kind"] for d in docs))
          '
      - name: Missing dev must fail the render
        run: |
          # capture first: the step shell runs with pipefail, so a failing
          # `helm template | grep` pipeline would fail on helm's exit code
          out=$(helm template broken charts/dev-namespace 2>&1 || true)
          grep -q 'must be an RFC 1123 name' <<<"$out"
      - name: Lint the pipen-operator chart
        run: helm lint charts/pipen-operator
      - name: Template the pipen-operator chart and parse the rendered manifests
        run: |
          # the CRD must be a rendered release resource (templates/crd.yaml):
          # Helm 4 does not install the crds/ directory at all
          helm template ci-checker charts/pipen-operator \
            | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          kinds = [d["kind"] for d in docs]
          assert len(docs) == 16, f"expected 16 manifests, got {len(docs)}"
          crds = [d["metadata"]["name"] for d in docs if d["kind"] == "CustomResourceDefinition"]
          assert "pens.pens.pipen.dev" in crds, "pen CRD missing from the render"
          assert "sandboxes.agents.x-k8s.io" in crds, "agent-sandbox CRD missing from the render"
          print(f"{len(docs)} manifests OK: " + ", ".join(kinds))
          '

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv lockfile check + install
        run: uv sync --locked
        working-directory: cli
      - name: CLI smoke
        run: uv run pipen --help
        working-directory: cli
      - name: CLI unit tests
        run: uv run python -m unittest discover -s tests
        working-directory: cli

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: operator
      - name: go vet + build + test
        working-directory: operator
        run: |
          go vet ./...
          go build ./...
          go test ./...

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the dev toolchain image
        uses: docker/build-push-action@v6
        with:
          context: devenv
          tags: pipen-herdr-dev:ci
          load: true
          cache-from: type=gha,scope=herdr-image
          cache-to: type=gha,scope=herdr-image,mode=max
      - name: Build the kind node image
        run: docker build -t pipen-kind-node:ci kind-node/
      - name: Boot probe with an empty config dir
        run: |
          # the pen must boot with no model config at all: systemd is PID 1,
          # the setup oneshot creates the dev user from the DEV_USER
          # container env, sshd runs, dockerd runs as a systemd service with
          # the systemd cgroup driver (a memory-limited child gets its
          # limit in its scope), and no config file is placed
          work="$RUNNER_TEMP/probe1"
          mkdir -p "$work/secret" "$work/config"
          printf 'ssh-ed25519 AAAACIKEY probe\n' > "$work/secret/authorized_keys"
          docker run -d --name herdr-probe1 --privileged \
            -e DEV_USER=probe \
            -v "$work/secret":/run/herdr/secret \
            -v "$work/config":/run/herdr/config \
            -v herdr-probe1-home:/home \
            pipen-herdr-dev:ci
          for i in $(seq 1 60); do
            docker exec herdr-probe1 pgrep -x sshd >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe1 pgrep -x sshd \
            || { docker logs herdr-probe1 >&2; echo "sshd not running" >&2; exit 1; }
          [ "$(docker exec herdr-probe1 cat /proc/1/comm)" = "systemd" ] \
            || { echo "PID 1 is not systemd" >&2; exit 1; }
          [ "$(docker exec herdr-probe1 systemctl is-active pen-setup.service)" = "active" ] \
            || { docker exec herdr-probe1 journalctl -u pen-setup.service >&2; exit 1; }
          # dockerd is a systemd service with the pinned systemd cgroup
          # driver (the cgroup-v2 memory-delegation proof happens in the
          # kata validation, where the FUSE rootfs makes it non-trivial)
          for i in $(seq 1 30); do
            docker exec herdr-probe1 docker info >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe1 docker info | grep -q "Cgroup Driver: systemd" \
            || { docker exec herdr-probe1 docker info >&2; echo "cgroup driver is not systemd" >&2; exit 1; }
          docker exec herdr-probe1 id probe >/dev/null
          docker exec herdr-probe1 test ! -e /home/probe/.pi/agent \
            || { echo "~/.pi/agent exists with an empty config" >&2; exit 1; }
          docker exec herdr-probe1 test ! -e /home/probe/.litellm_key \
            || { echo "~/.litellm_key exists with an empty config" >&2; exit 1; }
          echo "empty-config boot OK (systemd)"
          docker stop herdr-probe1 >/dev/null
      - name: Boot probe with a dropped key
        run: |
          # two boots on one /home volume. Boot 1 carries models.json and
          # litellm_key. The developer then writes a settings.json by hand.
          # Boot 2 carries no keys: the placed files and their markers go,
          # the developer's file stays
          work="$RUNNER_TEMP/probe2"
          mkdir -p "$work/secret" "$work/config-full" "$work/config-empty"
          printf 'ssh-ed25519 AAAACIKEY probe\n' > "$work/secret/authorized_keys"
          printf '[]' > "$work/config-full/models.json"
          printf 'sk-probe' > "$work/config-full/litellm_key"
          docker run -d --name herdr-probe2a --privileged \
            -e DEV_USER=probe \
            -v "$work/secret":/run/herdr/secret \
            -v "$work/config-full":/run/herdr/config \
            -v herdr-probe2-home:/home \
            pipen-herdr-dev:ci
          for i in $(seq 1 60); do
            docker exec herdr-probe2a pgrep -x sshd >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe2a pgrep -x sshd \
            || { docker logs herdr-probe2a >&2; echo "boot 1: sshd not running" >&2; exit 1; }
          [ "$(docker exec herdr-probe2a cat /proc/1/comm)" = "systemd" ] \
            || { echo "boot 1: PID 1 is not systemd" >&2; exit 1; }
          # the developer writes a settings.json by hand on the /home volume
          docker run --rm --entrypoint sh -v herdr-probe2-home:/home pipen-herdr-dev:ci \
            -c 'mkdir -p /home/probe/.pi/agent && printf dev > /home/probe/.pi/agent/settings.json'
          docker stop herdr-probe2a >/dev/null
          docker run -d --name herdr-probe2b --privileged \
            -e DEV_USER=probe \
            -v "$work/secret":/run/herdr/secret \
            -v "$work/config-empty":/run/herdr/config \
            -v herdr-probe2-home:/home \
            pipen-herdr-dev:ci
          for i in $(seq 1 60); do
            docker exec herdr-probe2b pgrep -x sshd >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe2b pgrep -x sshd \
            || { docker logs herdr-probe2b >&2; echo "boot 2: sshd not running" >&2; exit 1; }
          [ "$(docker exec herdr-probe2b cat /proc/1/comm)" = "systemd" ] \
            || { echo "boot 2: PID 1 is not systemd" >&2; exit 1; }
          docker exec herdr-probe2b test ! -e /home/probe/.pi/agent/models.json \
            || { echo "placed models.json survived a key drop" >&2; exit 1; }
          docker exec herdr-probe2b test ! -e /home/probe/.litellm_key \
            || { echo "placed litellm_key survived a key drop" >&2; exit 1; }
          markers=$(docker exec herdr-probe2b sh -c 'ls /home/.herdr/projected/*.sha256 2>/dev/null || true')
          [ -z "$markers" ] \
            || { echo "projected markers survived a key drop: $markers" >&2; exit 1; }
          [ "$(docker exec herdr-probe2b cat /home/probe/.pi/agent/settings.json)" = "dev" ] \
            || { echo "developer settings.json was touched" >&2; exit 1; }
          echo "dropped-key boot OK"
          docker stop herdr-probe2b >/dev/null
      - name: Boot probe with a key ssh
        run: |
          # the first two probes only check the image with docker exec. This
          # one drives a real key ssh: generate a key on the runner, project
          # the public key, publish sshd's port, and confirm the login lands
          # in the dev home
          work="$RUNNER_TEMP/probe3"
          mkdir -p "$work/secret" "$work/config"
          ssh-keygen -q -t ed25519 -N '' -f "$work/id_probe"
          cp "$work/id_probe.pub" "$work/secret/authorized_keys"
          docker run -d --name herdr-probe3 --privileged \
            -e DEV_USER=probe \
            -p 127.0.0.1:2222:22 \
            -v "$work/secret":/run/herdr/secret \
            -v "$work/config":/run/herdr/config \
            -v herdr-probe3-home:/home \
            pipen-herdr-dev:ci
          for i in $(seq 1 60); do
            docker exec herdr-probe3 pgrep -x sshd >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe3 pgrep -x sshd \
            || { docker logs herdr-probe3 >&2; echo "sshd not running" >&2; exit 1; }
          [ "$(docker exec herdr-probe3 cat /proc/1/comm)" = "systemd" ] \
            || { echo "PID 1 is not systemd" >&2; exit 1; }
          if ! home="$(ssh -i "$work/id_probe" -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes probe@127.0.0.1 'echo "$HOME"')"; then
            docker logs herdr-probe3 >&2
            echo "key ssh as probe failed" >&2
            exit 1
          fi
          [ "$home" = "/home/probe" ] \
            || { echo "key ssh landed in $home, want /home/probe" >&2; exit 1; }
          echo "key ssh OK: landed in $home"
          docker stop herdr-probe3 >/dev/null
      - name: Boot probe with credentials
        run: |
          # two boots on one /home volume. Boot 1 projects a credentials
          # dir with two keys, one dot-named (.env): each file lands in
          # ~/.herdr/credentials/ (dir 0700, file 0600 owned by the dev
          # user, content intact) and leaves a sha256 marker under
          # ~/.herdr/projected-credentials. Boot 2 projects an empty dir:
          # the placed files and their markers go (drop-on-delete)
          work="$RUNNER_TEMP/probe4"
          mkdir -p "$work/secret" "$work/config" "$work/credentials-full" "$work/credentials-empty"
          printf 'ssh-ed25519 AAAACIKEY probe\n' > "$work/secret/authorized_keys"
          printf 'ghp-probe' > "$work/credentials-full/token"
          printf 'env-dot' > "$work/credentials-full/.env"
          docker run -d --name herdr-probe4a --privileged \
            -e DEV_USER=probe \
            -v "$work/secret":/run/herdr/secret \
            -v "$work/config":/run/herdr/config \
            -v "$work/credentials-full":/run/herdr/credentials \
            -v herdr-probe4-home:/home \
            pipen-herdr-dev:ci
          for i in $(seq 1 60); do
            docker exec herdr-probe4a pgrep -x sshd >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe4a pgrep -x sshd \
            || { docker logs herdr-probe4a >&2; echo "boot 1: sshd not running" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a cat /proc/1/comm)" = "systemd" ] \
            || { echo "boot 1: PID 1 is not systemd" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a systemctl is-active pen-setup.service)" = "active" ] \
            || { docker exec herdr-probe4a journalctl -u pen-setup.service >&2; exit 1; }
          docker exec herdr-probe4a test -f /home/probe/.herdr/credentials/token \
            || { echo "credential file was not placed" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a stat -c '%a' /home/probe/.herdr/credentials)" = "700" ] \
            || { echo "credentials dir is not 0700" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a stat -c '%a' /home/probe/.herdr/credentials/token)" = "600" ] \
            || { echo "credential file is not 0600" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a stat -c '%U' /home/probe/.herdr/credentials/token)" = "probe" ] \
            || { echo "credential file is not owned by the dev user" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a cat /home/probe/.herdr/credentials/token)" = "ghp-probe" ] \
            || { echo "credential content does not match" >&2; exit 1; }
          docker exec herdr-probe4a test -f /home/probe/.herdr/projected-credentials/token.sha256 \
            || { echo "credentials marker missing" >&2; exit 1; }
          # the dot-named key goes through the same checks
          docker exec herdr-probe4a test -f /home/probe/.herdr/credentials/.env \
            || { echo "dot-named credential file was not placed" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a stat -c '%a' /home/probe/.herdr/credentials/.env)" = "600" ] \
            || { echo "dot-named credential file is not 0600" >&2; exit 1; }
          [ "$(docker exec herdr-probe4a cat /home/probe/.herdr/credentials/.env)" = "env-dot" ] \
            || { echo "dot-named credential content does not match" >&2; exit 1; }
          docker exec herdr-probe4a test -f /home/probe/.herdr/projected-credentials/.env.sha256 \
            || { echo "dot-named credentials marker missing" >&2; exit 1; }
          echo "credentials boot 1 OK"
          docker stop herdr-probe4a >/dev/null
          docker run -d --name herdr-probe4b --privileged \
            -e DEV_USER=probe \
            -v "$work/secret":/run/herdr/secret \
            -v "$work/config":/run/herdr/config \
            -v "$work/credentials-empty":/run/herdr/credentials \
            -v herdr-probe4-home:/home \
            pipen-herdr-dev:ci
          for i in $(seq 1 60); do
            docker exec herdr-probe4b pgrep -x sshd >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec herdr-probe4b pgrep -x sshd \
            || { docker logs herdr-probe4b >&2; echo "boot 2: sshd not running" >&2; exit 1; }
          [ "$(docker exec herdr-probe4b cat /proc/1/comm)" = "systemd" ] \
            || { echo "boot 2: PID 1 is not systemd" >&2; exit 1; }
          [ "$(docker exec herdr-probe4b systemctl is-active pen-setup.service)" = "active" ] \
            || { docker exec herdr-probe4b journalctl -u pen-setup.service >&2; exit 1; }
          docker exec herdr-probe4b test ! -e /home/probe/.herdr/credentials/token \
            || { echo "placed credential survived a key drop" >&2; exit 1; }
          docker exec herdr-probe4b test ! -e /home/probe/.herdr/credentials/.env \
            || { echo "placed dot-named credential survived a key drop" >&2; exit 1; }
          docker exec herdr-probe4b test ! -e /home/probe/.herdr/projected-credentials/.env.sha256 \
            || { echo "dot-named credentials marker survived a key drop" >&2; exit 1; }
          markers=$(docker exec herdr-probe4b sh -c 'ls /home/probe/.herdr/projected-credentials/*.sha256 2>/dev/null || true')
          [ -z "$markers" ] \
            || { echo "credentials markers survived a key drop: $markers" >&2; exit 1; }
          echo "credentials dropped-key boot OK"
          docker stop herdr-probe4b >/dev/null
      - name: Build the operator image
        uses: docker/build-push-action@v6
        with:
          context: operator
          tags: pipen-operator:ci
          load: true
          cache-from: type=gha,scope=pipen-operator-image
          cache-to: type=gha,scope=pipen-operator-image,mode=max
      - name: Remove the probe containers and volumes
        run: |
          # best effort: a probe that failed early leaves no container or
          # volume behind, so ignore the errors
          docker rm -f herdr-probe1 herdr-probe2a herdr-probe2b herdr-probe3 \
            herdr-probe4a herdr-probe4b \
            >/dev/null 2>&1 || true
          docker volume rm herdr-probe1-home herdr-probe2-home herdr-probe3-home \
            herdr-probe4-home \
            >/dev/null 2>&1 || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install kind
        run: |
          kind_version=0.27.0
          curl -fsSL "https://kind.sigs.k8s.io/dl/v${kind_version}/kind-linux-amd64" -o kind
          sudo install kind /usr/local/bin/kind
      - name: Install kubectl
        run: |
          # match the kind node image (kind 0.27 ships k8s 1.33)
          kubectl_version=v1.33.1
          curl -fsSL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl" -o kubectl
          sudo install kubectl /usr/local/bin/kubectl
      - name: Install helm
        run: |
          helm_version=3.16.4
          curl -fsSL "https://get.helm.sh/helm-v${helm_version}-linux-amd64.tar.gz" | tar xz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Create the kind cluster
        run: kind create cluster --name e2e
      - name: Create the expandable StorageClass
        run: |
          # the kind default StorageClass (standard) does not allow volume
          # expansion, so the pen resize would fail. The job clones the
          # working provisioner of the default class into a class that does
          # allow it, so the provisioner name is read at runtime instead of
          # hardcoded. The class must exist before the pen is created (the
          # PVC is provisioned at pen create). The operator chart install
          # below points the operator at this class
          provisioner=$(kubectl get sc standard -o jsonpath='{.provisioner}')
          [ -n "$provisioner" ] || { echo "no provisioner on the default StorageClass" >&2; exit 1; }
          cat <<EOF | kubectl apply -f -
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: expandable
          provisioner: $provisioner
          allowVolumeExpansion: true
          reclaimPolicy: Delete
          volumeBindingMode: WaitForFirstConsumer
          EOF
      - name: Build the operator image
        run: docker build -t pipen-operator:e2e operator/
      - name: Load the operator image into kind
        run: kind load docker-image pipen-operator:e2e --name e2e
      - name: Download and verify the pinned agent-sandbox asset
        run: |
          # The operator chart is the only installer. This download pins the
          # release that its vendored agent-sandbox manifest must match.
          sandbox_file="$RUNNER_TEMP/sandbox.yaml"
          curl -fsSL "https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v1.0.12/sandbox.yaml" \
            -o "$sandbox_file"
          echo "9c400c9d875061088c28598525b7ec37a5c2cb50460804c6b6f53f5fc37301ff  $sandbox_file" \
            | sha256sum --check -
      - name: Install the operator chart with kind-shaped values
        run: |
          # kind shape: the long-running pause image, a small pod.
          # serviceAnnotations cannot be cleared with --set or a values file
          # (helm deep-merges maps), so that config is patched to the kind
          # shape after the install. The other chart defaults now match the
          # plain kind cluster (no runtime class, no node selector). The
          # kind default StorageClass does not allow volume expansion, so
          # the install points the operator at the expandable class created
          # above.
          helm install operator charts/pipen-operator \
            --set image=pipen-operator:e2e \
            --set config.image=registry.k8s.io/pause:3.10 \
            --set config.homeSize=1Gi \
            --set config.cpu=100m \
            --set config.memory=128Mi \
            --set config.storageClass=expandable
          kubectl -n pipen patch configmap pipen-operator-config \
            --type merge -p '{"data":{"serviceAnnotations":"{}"}}'
      - name: The agent-sandbox controller is ready
        run: |
          kubectl get crd sandboxes.agents.x-k8s.io
          kubectl -n agent-sandbox-system rollout status \
            deploy/agent-sandbox-controller --timeout=180s
      - name: Install the dev-namespace chart
        run: |
          helm install ci-dev charts/dev-namespace \
            --set dev=ci \
            --set 'authorizedKeys[0]=ssh-ed25519 AAAACIKEY e2e'
      - name: Create the dev bootstrap ConfigMap
        run: |
          # the dev-namespace README hands this step to the admin; the e2e
          # exercises the optional-config path: one key only (models.json),
          # so the pen pod mounts a partial ConfigMap. The pen runs the
          # pause image; the dev image never runs in the e2e
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: herdr-dev-env-ci
            namespace: env-ci
          data:
            models.json: "[]"
          EOF
      - name: The operator Deployment is ready
        run: kubectl -n pipen rollout status deploy/pipen-operator --timeout=180s
      - name: Read the dev token and build its kubeconfig
        run: |
          # the token controller populates data.token asynchronously
          token=""
          for i in $(seq 1 30); do
            token=$(kubectl -n env-ci get secret deploy-token \
              -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
            [ -n "$token" ] && break
            sleep 2
          done
          [ -n "$token" ] || { echo "deploy-token was never populated" >&2; exit 1; }
          # kind's kubeconfig carries a cluster-admin client cert, and
          # kubectl presents that cert even when --token is set. The dev
          # assertions must run as the dev ServiceAccount, so the dev
          # steps use a token-only kubeconfig instead of --token.
          server=$(kind get kubeconfig --name e2e | grep -oE 'https://127\.0\.0\.1:[0-9]+' | head -1)
          [ -n "$server" ] || { echo "kind cluster server not found in the kubeconfig" >&2; exit 1; }
          cat > "$RUNNER_TEMP/dev-kubeconfig" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: $server
                insecure-skip-tls-verify: true
              name: e2e
          contexts:
            - context:
                cluster: e2e
                user: dev
              name: e2e
          current-context: e2e
          users:
            - name: dev
              user:
                token: $token
          EOF
          echo "DEV_KUBECONFIG=$RUNNER_TEMP/dev-kubeconfig" >> "$GITHUB_ENV"
      - name: The dev token cannot create pods
        run: |
          # raw pod create is how the dev token could once spawn any
          # privileged pod; it must stay denied against the rendered Role
          [ "$(kubectl --kubeconfig "$DEV_KUBECONFIG" auth can-i create pods -n env-ci)" = "no" ]
      - name: The dev token can create Pens
        run: |
          # the resource is addressed by bare name: kubectl cannot express
          # the dotted group pens.pipen.dev in a resource string
          [ "$(kubectl --kubeconfig "$DEV_KUBECONFIG" auth can-i create pens -n env-ci)" = "yes" ]
      - name: Create the pen as the dev token
        run: |
          cat <<'EOF' | kubectl --kubeconfig "$DEV_KUBECONFIG" apply -f -
          apiVersion: pens.pipen.dev/v1alpha1
          kind: Pen
          metadata:
            name: ci-smoke
            namespace: env-ci
          spec:
            ttl: 1h
          EOF
      - name: The PVC, Service, Sandbox and Pod appear
        run: |
          # the operator reconciles on its own schedule; allow it a moment
          for i in $(seq 1 30); do
            kubectl -n env-ci get pvc ci-smoke-home >/dev/null 2>&1 \
              && kubectl -n env-ci get service ci-smoke >/dev/null 2>&1 \
              && kubectl -n env-ci get sandbox env-ci-smoke >/dev/null 2>&1 \
              && kubectl -n env-ci get pod env-ci-smoke >/dev/null 2>&1 \
              && break
            sleep 2
          done
          kubectl -n env-ci get pvc ci-smoke-home
          kubectl -n env-ci get service ci-smoke
          kubectl -n env-ci get sandbox env-ci-smoke
          kubectl -n env-ci get pod env-ci-smoke
      - name: The pod is ready
        run: kubectl -n env-ci wait --for=condition=Ready pod/env-ci-smoke --timeout=180s
      - name: The pod spec sets DEV_USER to the dev name
        run: |
          # the operator sets DEV_USER to the herdr.dev/owner label value
          # (the bare dev name), not the namespace name env-ci
          user="$(kubectl -n env-ci get pod env-ci-smoke \
            -o jsonpath='{.spec.containers[0].env[?(@.name=="DEV_USER")].value}')"
          [ "$user" = "ci" ] \
            || { echo "DEV_USER = $user, want ci" >&2; exit 1; }
      - name: The lockdown blocks cross-namespace traffic
        run: |
          # the 0.6.0 NetworkPolicies turn on isolation for the first time,
          # so the e2e proves all three directions with probe pods
          # (policy podSelector {} covers every pod in the namespace, probe
          # pods included):
          #  - a pod outside env-ci cannot connect to a pod in env-ci
          #  - a pod in env-ci cannot connect to a pod outside env-ci
          #  - DNS (kube-dns in kube-system) still works from env-ci
          # kindnet (kube-network-policies) evaluates traffic per pod pair.
          # Traffic addressed to a Service (ClusterIP) has no destination
          # pod, and kindnet applies no policy to it, so the e2e proves the
          # pod-to-pod direction. A full CNI (Calico, Cilium) enforces
          # egress to in-cluster Services; that is the reference-cluster
          # check
          # registry.k8s.io/busybox only mirrors up to 1.27, and that nc has
          # no -z flag: a connect with stdin on /dev/null exits 0 on success
          kubectl -n env-ci run np-listener \
            --image=registry.k8s.io/busybox:1.27 --restart=Never \
            --command -- sh -c 'while :; do nc -l -p 9090; done'
          kubectl -n default run np-client \
            --image=registry.k8s.io/busybox:1.27 --restart=Never \
            --command -- sh -c 'while :; do nc -l -p 9091; done'
          kubectl -n env-ci wait --for=condition=Ready pod/np-listener --timeout=120s
          kubectl -n default wait --for=condition=Ready pod/np-client --timeout=120s
          listener_ip=$(kubectl -n env-ci get pod np-listener -o jsonpath='{.status.podIP}')
          client_ip=$(kubectl -n default get pod np-client -o jsonpath='{.status.podIP}')
          # outside -> env pod: denied by default-deny ingress
          kubectl -n default exec np-client -- nc -w 5 "$listener_ip" 9090 </dev/null \
            && { echo "ingress leak: outside pod reached env pod" >&2; exit 1; }
          echo "outside -> env pod: denied OK"
          # env pod -> outside pod: denied by default-deny egress
          kubectl -n env-ci exec np-listener -- nc -w 5 "$client_ip" 9091 </dev/null \
            && { echo "egress leak: env pod reached pod outside env-ci" >&2; exit 1; }
          echo "env pod -> outside pod: denied OK"
          # DNS from env-ci must still work (the kube-dns allow rule)
          kubectl -n env-ci exec np-listener -- nslookup kubernetes.default >/dev/null \
            || { echo "DNS broken from env-ci" >&2; exit 1; }
          echo "DNS from env-ci OK"
          kubectl -n env-ci delete pod np-listener --wait=false
          kubectl -n default delete pod np-client --wait=false
      - name: Ready via the patched loadBalancer ingress
        run: |
          # kind runs no Tailscale operator, so the tailnet hostname is
          # simulated through the Service status subresource (the main
          # resource drops client status writes); the reconciler reports
          # the ingress hostname it reads
          kubectl -n env-ci patch service ci-smoke --subresource status --type merge \
            -p '{"status":{"loadBalancer":{"ingress":[{"hostname":"ci-smoke.ts.e2e"}]}}}'
          phase=""
          for i in $(seq 1 60); do
            phase=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.phase}')
            [ "$phase" = "Ready" ] && break
            sleep 2
          done
          [ "$phase" = "Ready" ] || { echo "pen phase = $phase, want Ready" >&2; exit 1; }
          hostname=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.hostname}')
          [ "$hostname" = "ci-smoke.ts.e2e" ] \
            || { echo "pen hostname = $hostname, want ci-smoke.ts.e2e" >&2; exit 1; }
          image=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.image}')
          [ "$image" = "registry.k8s.io/pause:3.10" ] \
            || { echo "pen image = $image, want registry.k8s.io/pause:3.10" >&2; exit 1; }
          echo "pen Ready at $hostname"
      - name: Write a resize marker into the home PVC
        run: |
          # The pen pod runs the pause image, which has no shell, so the
          # marker is written by a busybox pod that mounts the home PVC.
          # RWO is fine: kind is one node, so both pods land on it
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: resize-marker
            namespace: env-ci
          spec:
            restartPolicy: Never
            containers:
              - name: marker
                image: registry.k8s.io/busybox:1.27
                command: [sh, -c, 'touch /home/resize-marker']
                volumeMounts:
                  - name: home
                    mountPath: /home
            volumes:
              - name: home
                persistentVolumeClaim:
                  claimName: ci-smoke-home
          EOF
          exit_code=""
          for i in $(seq 1 60); do
            exit_code=$(kubectl -n env-ci get pod resize-marker \
              -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' \
              2>/dev/null || true)
            [ -n "$exit_code" ] && break
            sleep 2
          done
          [ "$exit_code" = "0" ] \
            || { kubectl -n env-ci get pod resize-marker -o yaml; echo "marker write exit code = ${exit_code:-not finished}, want 0" >&2; exit 1; }
          kubectl -n env-ci delete pod resize-marker --wait=false
      - name: Resize the pen with the CLI
        run: |
          # The e2e defaults are 100m / 128Mi / 1Gi (set by the operator
          # chart install above); the resize doubles the cpu and memory.
          # The resize does not change the home size: the kind cluster
          # provisions through rancher.io/local-path, which does not
          # implement volume expansion, so a live grow can never finish
          # in this job. The expansion logic (the SC check, the PVC
          # patch, the stall timeout) is unit-tested. See the PI-019 To
          # Do: assert a live grow when CI runs a provisioner that can
          # expand. The job still creates the expandable class and the
          # chart install points the operator at it, so the operator
          # runs against a named StorageClass like a real install
          # Record the pod uid first: the CLI can report Ready before
          # the operator starts the resize (its poll sees the stale
          # status), so the next step waits for a pod with a new uid
          uid=$(kubectl -n env-ci get pod env-ci-smoke -o jsonpath='{.metadata.uid}')
          [ -n "$uid" ] || { echo "pod env-ci-smoke not found" >&2; exit 1; }
          echo "RESIZE_POD_UID=$uid" >> "$GITHUB_ENV"
          # The CLI reads a flat config file (api_base, namespace,
          # dev_user, token) instead of a kubeconfig. The server comes
          # from the kind kubeconfig, the token from the dev kubeconfig.
          # The CLI is stdlib-only python, so no install step is needed
          server=$(kind get kubeconfig --name e2e | grep -oE 'https://127\.0\.0\.1:[0-9]+' | head -1)
          [ -n "$server" ] || { echo "kind cluster server not found in the kubeconfig" >&2; exit 1; }
          token=$(python3 -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["users"][0]["user"]["token"])' "$DEV_KUBECONFIG")
          [ -n "$token" ] || { echo "dev token not found in $DEV_KUBECONFIG" >&2; exit 1; }
          python3 cli/pipen.py config --out "$RUNNER_TEMP/pipen-e2e.yaml" \
            --api-base "$server" \
            --namespace env-ci \
            --dev-user ci \
            --token "$token"
          # The generated file must carry cli_version. The CLI unit
          # tests cover the optional --image, --operator-version,
          # --chart-version flags
          grep -q '^cli_version: ' "$RUNNER_TEMP/pipen-e2e.yaml" \
            || { echo "config has no cli_version" >&2; exit 1; }
          PIPEN_CONFIG="$RUNNER_TEMP/pipen-e2e.yaml" \
            python3 cli/pipen.py resize ci-smoke \
            --cpu 200m --memory 256Mi --timeout 300
      - name: The resize restarts the pod with the new resources
        run: |
          # The new pod is built from the updated sandbox template, so
          # once a pod with a new uid is Ready, one resource read is
          # enough
          uid=""
          for i in $(seq 1 30); do
            uid=$(kubectl -n env-ci get pod env-ci-smoke \
              -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
            if [ -n "$uid" ] && [ "$uid" != "$RESIZE_POD_UID" ] \
              && kubectl -n env-ci get pod env-ci-smoke \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' \
                | grep -q True; then
              break
            fi
            sleep 10
          done
          [ -n "$uid" ] && [ "$uid" != "$RESIZE_POD_UID" ] \
            || { echo "pod not recreated (uid = ${uid:-absent}, before = $RESIZE_POD_UID)" >&2; exit 1; }
          kubectl -n env-ci wait --for=condition=Ready pod/env-ci-smoke --timeout=180s
          cpu=$(kubectl -n env-ci get pod env-ci-smoke \
            -o jsonpath='{.spec.containers[0].resources.requests.cpu}')
          [ "$cpu" = "200m" ] || { echo "pod cpu = $cpu, want 200m" >&2; exit 1; }
          mem=$(kubectl -n env-ci get pod env-ci-smoke \
            -o jsonpath='{.spec.containers[0].resources.requests.memory}')
          [ "$mem" = "256Mi" ] || { echo "pod memory = $mem, want 256Mi" >&2; exit 1; }
      - name: The pen is Ready again after the resize
        run: |
          phase=""
          for i in $(seq 1 30); do
            phase=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.phase}')
            [ "$phase" = "Ready" ] && break
            sleep 2
          done
          [ "$phase" = "Ready" ] || { echo "pen phase = $phase, want Ready" >&2; exit 1; }
      - name: The credentials annotation mounts the secret
        run: |
          # Both calls run with the dev kubeconfig. The secret create
          # proves the dev Role's secrets grant. The pen patch proves the
          # dev Role's pens patch grant. The annotation change restarts
          # the pod through the convergence cycle, so the wait below
          # looks for a pod with a new uid
          uid=$(kubectl -n env-ci get pod env-ci-smoke -o jsonpath='{.metadata.uid}')
          [ -n "$uid" ] || { echo "pod env-ci-smoke not found" >&2; exit 1; }
          kubectl --kubeconfig "$DEV_KUBECONFIG" -n env-ci create secret generic \
            pen-creds --from-literal=token=ci-credential
          kubectl --kubeconfig "$DEV_KUBECONFIG" -n env-ci patch pen ci-smoke \
            --type merge -p '{"metadata":{"annotations":{"pens.pipen.dev/credentials":"pen-creds"}}}'
          new_uid=""
          for i in $(seq 1 30); do
            new_uid=$(kubectl -n env-ci get pod env-ci-smoke \
              -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
            if [ -n "$new_uid" ] && [ "$new_uid" != "$uid" ] \
              && kubectl -n env-ci get pod env-ci-smoke \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' \
                | grep -q True; then
              break
            fi
            sleep 10
          done
          [ -n "$new_uid" ] && [ "$new_uid" != "$uid" ] \
            || { echo "pod not recreated (uid = ${new_uid:-absent}, before = $uid)" >&2; exit 1; }
          kubectl -n env-ci wait --for=condition=Ready pod/env-ci-smoke --timeout=180s
          vol_secret=$(kubectl -n env-ci get pod env-ci-smoke \
            -o jsonpath='{.spec.volumes[?(@.name=="dev-credentials")].secret.secretName}')
          [ "$vol_secret" = "pen-creds" ] \
            || { echo "dev-credentials volume secretName = ${vol_secret:-absent}, want pen-creds" >&2; exit 1; }
          mount_path=$(kubectl -n env-ci get pod env-ci-smoke \
            -o jsonpath='{.spec.containers[0].volumeMounts[?(@.name=="dev-credentials")].mountPath}')
          [ "$mount_path" = "/run/herdr/credentials" ] \
            || { echo "dev-credentials mount path = ${mount_path:-absent}, want /run/herdr/credentials" >&2; exit 1; }
          read_only=$(kubectl -n env-ci get pod env-ci-smoke \
            -o jsonpath='{.spec.containers[0].volumeMounts[?(@.name=="dev-credentials")].readOnly}')
          [ "$read_only" = "true" ] \
            || { echo "dev-credentials mount readOnly = ${read_only:-absent}, want true" >&2; exit 1; }
          phase=""
          for i in $(seq 1 30); do
            phase=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.phase}')
            [ "$phase" = "Ready" ] && break
            sleep 2
          done
          [ "$phase" = "Ready" ] || { echo "pen phase = $phase, want Ready" >&2; exit 1; }
      - name: The marker file survived the resize
        run: |
          # The pause image has no shell, so the check runs in a
          # busybox pod that mounts the home PVC, like the write step
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: resize-marker-check
            namespace: env-ci
          spec:
            restartPolicy: Never
            containers:
              - name: check
                image: registry.k8s.io/busybox:1.27
                command: [sh, -c, 'test -f /home/resize-marker']
                volumeMounts:
                  - name: home
                    mountPath: /home
            volumes:
              - name: home
                persistentVolumeClaim:
                  claimName: ci-smoke-home
          EOF
          exit_code=""
          for i in $(seq 1 60); do
            exit_code=$(kubectl -n env-ci get pod resize-marker-check \
              -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' \
              2>/dev/null || true)
            [ -n "$exit_code" ] && break
            sleep 2
          done
          [ "$exit_code" = "0" ] \
            || { kubectl -n env-ci get pod resize-marker-check -o yaml; echo "marker check exit code = ${exit_code:-not finished}, want 0 (marker file missing?)" >&2; exit 1; }
          kubectl -n env-ci delete pod resize-marker-check --wait=false
      - name: Pause removes the pod and keeps the Service and PVC
        run: |
          shutdown_before_pause=$(kubectl -n env-ci get pen ci-smoke \
            -o jsonpath='{.status.shutdownAt}')
          [ -n "$shutdown_before_pause" ] \
            || { echo "pen shutdownAt is empty before pause" >&2; exit 1; }
          echo "SHUTDOWN_BEFORE_PAUSE=$shutdown_before_pause" >> "$GITHUB_ENV"
          # These patches run with the admin kubeconfig, not the dev
          # kubeconfig. The dev token can patch pens since 0.7.3, and the
          # credentials step above uses that grant.
          kubectl -n env-ci patch pen ci-smoke \
            --type merge -p '{"spec":{"paused":true}}'
          phase=""
          for i in $(seq 1 60); do
            phase=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.phase}')
            if [ "$phase" = "Suspended" ] \
              && ! kubectl -n env-ci get pod env-ci-smoke >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          [ "$phase" = "Suspended" ] \
            || { echo "pen phase = $phase, want Suspended" >&2; exit 1; }
          kubectl -n env-ci get pod env-ci-smoke 2>/dev/null \
            && { echo "pod env-ci-smoke still present after pause" >&2; exit 1; }
          mode=$(kubectl -n env-ci get sandbox env-ci-smoke -o jsonpath='{.spec.operatingMode}')
          [ "$mode" = "Suspended" ] \
            || { echo "sandbox operatingMode = $mode, want Suspended" >&2; exit 1; }
          kubectl -n env-ci get service ci-smoke
          kubectl -n env-ci get pvc ci-smoke-home
      - name: Resume restores Ready and resets the TTL
        run: |
          kubectl -n env-ci patch pen ci-smoke \
            --type merge -p '{"spec":{"paused":false}}'
          before=$(date --date="$SHUTDOWN_BEFORE_PAUSE" +%s)
          phase=""
          shutdown_at=""
          fresh=false
          for i in $(seq 1 60); do
            phase=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.phase}')
            shutdown_at=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.shutdownAt}')
            if [ "$phase" = "Ready" ] && [ -n "$shutdown_at" ]; then
              after=$(date --date="$shutdown_at" +%s)
              if [ "$after" -gt "$before" ]; then
                fresh=true
                break
              fi
            fi
            sleep 2
          done
          [ "$fresh" = "true" ] \
            || { echo "pen phase = $phase, shutdownAt = $shutdown_at; want Ready and a time after $SHUTDOWN_BEFORE_PAUSE" >&2; exit 1; }
          kubectl -n env-ci wait --for=condition=Ready pod/env-ci-smoke --timeout=180s
          hostname=$(kubectl -n env-ci get pen ci-smoke -o jsonpath='{.status.hostname}')
          [ "$hostname" = "ci-smoke.ts.e2e" ] \
            || { echo "pen hostname = $hostname, want ci-smoke.ts.e2e" >&2; exit 1; }
          echo "pen Ready again at $hostname with shutdownAt $shutdown_at"
      - name: Down removes the Pen, Sandbox and Pod but leaves the PVC
        run: |
          # the Sandbox, pod and Service are owned by the Pen and are
          # garbage-collected with it; the home PVC is deliberately not
          # owned, so the dev's data survives a pen deletion
          kubectl --kubeconfig "$DEV_KUBECONFIG" -n env-ci delete pen ci-smoke --wait=false
          for i in $(seq 1 60); do
            if ! kubectl -n env-ci get pen ci-smoke >/dev/null 2>&1 \
              && ! kubectl -n env-ci get sandbox env-ci-smoke >/dev/null 2>&1 \
              && ! kubectl -n env-ci get pod env-ci-smoke >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          kubectl -n env-ci get pen ci-smoke 2>/dev/null \
            && { echo "pen ci-smoke still present" >&2; exit 1; }
          kubectl -n env-ci get sandbox env-ci-smoke 2>/dev/null \
            && { echo "sandbox env-ci-smoke still present" >&2; exit 1; }
          kubectl -n env-ci get pod env-ci-smoke 2>/dev/null \
            && { echo "pod env-ci-smoke still present" >&2; exit 1; }
          kubectl -n env-ci get service ci-smoke 2>/dev/null \
            && { echo "service ci-smoke still present" >&2; exit 1; }
          kubectl -n env-ci get pvc ci-smoke-home
