# Pin node: nodeenv's default resolves to a node 27.0.0-alpha distro that
# crashes its own version parser (same pin + reason as hosted-llm).
default_language_version:
  node: "22"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        # helm templates are not valid yaml pre-render
        exclude: ^charts/.*/templates/
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Go (operator/): format + vet. Local hooks — go lives on the machine
  # (or CI), so no hook repo to pin.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt (operator)
        entry: gofmt -l -w
        language: system
        files: ^operator/.*\.go$
        pass_filenames: true
      - id: go-vet
        name: go vet (operator)
        entry: bash -c 'cd operator && go vet ./...'
        language: system
        files: ^operator/
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        files: ^devenv/Dockerfile$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        files: ^cli/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.4
    hooks:
      - id: prettier
        # pre-commit's nodeenv 'default' resolves to a 27.x alpha it can't parse
        language_version: 22.23.4
        types_or: [markdown, yaml]
        # helm templates break prettier's yaml parser (and it mangles `{{ }}`)
        exclude: ^charts/.*/templates/
        additional_dependencies:
          - prettier@3.6.2
