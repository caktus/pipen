# The dev's ssh public keys, projected by the pipen CLI's pod template into
# each env's key-only sshd (~/.ssh/authorized_keys in the dev's home).
apiVersion: v1
kind: Secret
metadata:
  name: "herdr-dev-{{ .Values.dev }}"
  namespace: {{ .Values.dev | quote }}
  labels:
    {{- include "dev-namespace.labels" . | nindent 4 }}
type: Opaque
stringData:
  authorized_keys: {{ .Values.authorizedKeys | join "\n" | quote }}
