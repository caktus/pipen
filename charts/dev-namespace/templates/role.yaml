# ns-scoped Role for the per-developer pipen CLI: everything `pipen
# up/ssh/down/ls/logs` needs, and nothing else. The CLI manages only the
# Pen CR now — the operator (separate SA, see operator-role.yaml) creates
# the pod/Service/PVC. Notably NO pvc delete (the admin-only data wipe),
# NO pod/service create (that is how a dev token could once spawn any
# privileged pod), no cluster-wide, no cross-ns.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy
  namespace: {{ include "dev-namespace.name" . | quote }}
  labels:
    {{- include "dev-namespace.labels" . | nindent 4 }}
rules:
  - apiGroups: ["pens.pipen.dev"]
    resources: [pens]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: ["pens.pipen.dev"]
    resources: [pens/status]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The developer manages their own pen credential Secrets
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, update, delete]
