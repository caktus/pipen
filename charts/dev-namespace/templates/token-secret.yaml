# Explicit long-lived SA token for the `deploy` ServiceAccount (auto-
# issuance of SA tokens is gone on modern k8s; explicit Secrets are still
# signed). The token controller populates data.token ASYNCHRONOUSLY after
# creation — wait for it before reading (the bootstrap that hands the token
# to the developer polls for it).
#
# Helm never manages data.token: it is controller-populated, and upgrades
# preserve it. Deleting the Secret (not `helm uninstall`) is what rotates
# the token — and breaks the developer's existing CLI config.
apiVersion: v1
kind: Secret
metadata:
  name: deploy-token
  namespace: {{ include "dev-namespace.name" . | quote }}
  labels:
    {{- include "dev-namespace.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: deploy
type: kubernetes.io/service-account-token
