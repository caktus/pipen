# Developer name — this IS the namespace name. Must be RFC 1123
# (lowercase alphanumerics and '-'); a developer the admins have granted
# an environment for.
dev: ""

# OpenSSH public keys authorized on each env's key-only sshd. Rendered into
# Secret herdr-dev-<dev> (key authorized_keys), which the herdr CLI's pod
# template projects into every env.
authorizedKeys: []
