# Developer name: the developer identity the admins have granted an
# environment for. It is the namespace label herdr.dev/owner and the
# prefix the CLI force-adds to every pen name (<dev>-<env>).
# The namespace itself is named <namespacePrefix><dev>.
dev: ""

# Prefix for the developer namespace name: the Namespace and all its
# objects are named <namespacePrefix><dev> (default env-tobias for dev
# tobias). The composed name must be RFC 1123 (lowercase alphanumerics
# and '-') and at most 63 characters. The render fails when it is not.
namespacePrefix: env-

# OpenSSH public keys authorized on each env's key-only sshd. Rendered into
# Secret herdr-dev-<namespace> (key authorized_keys), which the herdr CLI's
# pod template projects into every env.
authorizedKeys: []

# Where the cluster-wide pipen-operator lives (pipen-operator chart). Its
# ServiceAccount gets a per-namespace write Role in this namespace.
operator:
  namespace: pipen

# Where the tailscale-operator L3 ssh proxy StatefulSet runs. The ingress
# NetworkPolicy allows that namespace to reach env pods on port 22. The
# operator default is the namespace named `tailscale`.
tailscale:
  namespace: tailscale

# Extra egress this dev namespace may use, beyond the public internet and
# DNS that are always allowed. Without these, a dev pod reaches no other
# namespace and no cluster service.
egress:
  # Fixed CIDR ranges, as strings. Each becomes one egress allow to that
  # range (for example "100.64.0.0/10", the tailscale CGNAT).
  cidrAllows: []
  # Targets by namespace, pod selector and port. Each entry needs namespace
  # and podSelector (a label map); port is optional (omit it to allow all
  # ports to those pods). For example the litellm proxy pod in a litellm
  # namespace:
  #   - namespace: litellm
  #     podSelector:
  #       app: litellm
  #     port: 4000
  podAllows: []
