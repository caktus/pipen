# Cluster-scoped READ-ONLY access to pens, namespaces and storageclasses: the operator reconciles pens
# in every provisioned developer namespace. It also reads the storage
# class to check home expansion. All writes are per-namespace Roles
# created by the dev-namespace chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipen-operator
  labels:
    app.kubernetes.io/name: pipen-operator
rules:
  - apiGroups: ["pens.pipen.dev"]
    resources: [pens]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get]
