# Cluster-scoped binding (cluster-scoped read-only Role, operator SA in ns
# pipen). Installed once per cluster: a second release would conflict here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipen-operator
  labels:
    app.kubernetes.io/name: pipen-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pipen-operator
subjects:
  - kind: ServiceAccount
    name: pipen-operator
    namespace: pipen
