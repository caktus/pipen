apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipen-operator
  namespace: pipen
  labels:
    app.kubernetes.io/name: pipen-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pipen-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipen-operator
    spec:
      serviceAccountName: pipen-operator
{{- with .Values.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: operator
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ if hasSuffix ":latest" .Values.image }}Always{{ else }}IfNotPresent{{ end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
