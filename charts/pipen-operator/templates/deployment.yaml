apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipen-operator
  namespace: pipen
  labels:
    app.kubernetes.io/name: pipen-operator
{{ include "pipen-operator.requireImage" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pipen-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipen-operator
    spec:
      serviceAccountName: pipen-operator
      containers:
        - name: operator
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
