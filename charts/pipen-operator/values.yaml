# Operator image (full reference). Defaults to the public GHCR package that
# the publish-operator workflow maintains.
image: "ghcr.io/caktus/pipen-operator:latest"

# One replica; leader election is on so a future 2-replica flip is cheap.
replicaCount: 1

# Pod-level scheduling for the operator Deployment. Empty (the default):
# the cluster scheduler picks. Set it to pin the operator to node(s) that
# already hold a locally staged image, e.g. nodeSelector: {kubernetes.io/hostname: node1}
nodeSelector: {}

# Cluster shape, rendered into ConfigMap pipen-operator-config which the
# operator reads (and watches: a change re-reconciles all pens).
config:
  # Default pod image for pens (Pen spec.image overrides per pen).
  # A pinned date tag. The chart re-pins this when a new pen image lands
  # on main and releases.
  image: "ghcr.io/caktus/pipen:20261124-pi1.6.0"
  # Home PVC size.
  homeSize: "10Gi"
  # Pod cpu request/limit.
  cpu: "4"
  # Pod memory request/limit.
  memory: "8Gi"
  # Node selector: the only nodes that can attach the home volume. Empty
  # (default): pens can attach the home PVC to any node.
  nodeSelector: {}
  # Home PVC storage class. Empty (default): the cluster's default
  # StorageClass applies.
  storageClass: ""
  # Annotations on every pen Service (tailscale L4 exposure). The
  # tailscale.com/hostname annotation is set per pen by the operator.
  serviceAnnotations:
    tailscale.com/expose: "true"
  # Informational tailnet domain (TAILNET_HOSTNAME env, logged hostnames).
  tailnetDomain: ""
  # Pod image pull policy (latest tags always pull).
  imagePullPolicy: "IfNotPresent"
  # loadBalancerClass for pen Services (the Tailscale operator).
  loadBalancerClass: "tailscale"
  # Runtime class for env pods. Empty (default): no runtime class.
  runtimeClass: ""

# Sandbox and egress settings, rendered into ConfigMap pipen-operator-config.
operatorConfig:
  # Default time before a pen shuts down, for example "8h". Empty (default):
  # no automatic shutdown. A pen's ttl value overrides this default.
  defaultTTL: ""
  # Let the agent-sandbox controller create a Service for each sandbox.
  # False (default): only the tailscale Service exists.
  sandboxService: false
  # Approved egress FQDNs. A pen with egress enabled can reach these hosts.
  # Empty (default): no per-pen egress policy.
  egressHosts: []
