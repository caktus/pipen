[project]
name = "pipen-cli"
version = "0.1.0"
description = "Per-developer CLI for herdr kata dev environments (stdlib only)"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
# pipen.py is the module; the command is `pipen`
pipen = "pipen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single-file layout: ship pipen.py as the top-level `pipen` module.
# The CLI manages only the Pen CR — no template files; run `uv tool
# install <repo>/cli` or `uv run cli/pipen.py` from the repo.
[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"pipen.py" = "pipen.py"
