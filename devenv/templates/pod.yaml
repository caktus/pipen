# herdr env pod spec — rendered by the CLI (cli/pipen.py) by
# substituting the double-brace placeholders, then POSTed with the dev's SA
# token.
#
# Scheduling: kata on the Mayastor storage nodes (openebs.io/engine=mayastor —
# the only nodes that can attach a mayastor-2 volume; the PVC is
# WaitForFirstConsumer, so it binds to the node the pod lands on).
# /home is the per-env mirrored PVC <name>-home (created by `herdr up`);
# the dev Secret/ConfigMap are projected read-only for the entrypoint.
# 4 CPU / 8 Gi defaults — the CLI flags override.
apiVersion: v1
kind: Pod
metadata:
  name: env-{{ name }}
  namespace: "{{ namespace }}"
  labels:
    herdr.dev/env: "{{ name }}"
spec:
  runtimeClassName: kata
  restartPolicy: Always
  nodeSelector:
    openebs.io/engine: mayastor
  containers:
    - name: env
      image: localhost:32000/herdr/dev:{{ image_tag }}
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true # dockerd inside the kata guest
      env:
        - name: DEV_USER
          value: "{{ dev_user }}"
        - name: TAILNET_HOSTNAME
          value: "{{ hostname }}"
      resources:
        requests:
          cpu: "{{ cpu }}"
          memory: "{{ memory }}"
        limits:
          cpu: "{{ cpu }}"
          memory: "{{ memory }}"
      volumeMounts:
        - name: home
          mountPath: /home
        - name: dev-secret
          mountPath: /run/herdr/secret
          readOnly: true
        - name: dev-config
          mountPath: /run/herdr/config
          readOnly: true
  volumes:
    - name: home
      persistentVolumeClaim:
        claimName: "{{ name }}-home"
    - name: dev-secret
      secret:
        secretName: herdr-dev-{{ dev_user }}
        items:
          - key: authorized_keys
            path: authorized_keys
    - name: dev-config
      configMap:
        name: env-{{ name }}-config
        items:
          - key: models.json
            path: models.json
          - key: settings.json
            path: settings.json
          - key: litellm_key
            path: litellm_key
