# herdr env Service spec — rendered by the CLI and POSTed with the dev's SA
# token. L4 tailnet exposure via the Tailscale operator (operator 1.104.4):
# the LoadBalancer + loadBalancerClass form is REQUIRED — a bare ClusterIP
# with the expose annotation is inert. The operator creates a per-Service
# sidecar proxy (StatefulSet in ns tailscale, owner-referenced to this
# Service), so `herdr down`'s Service delete tears it down automatically.
#
# The operator may SUFFIX the assigned MagicDNS hostname (e.g. <name> ->
# <name>-1) — clients must read status.loadBalancer.ingress, never this
# annotation. The CLI does.
apiVersion: v1
kind: Service
metadata:
  name: "{{ name }}"
  namespace: "{{ namespace }}"
  labels:
    herdr.dev/env: "{{ name }}"
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "{{ name }}"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    herdr.dev/env: "{{ name }}"
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      protocol: TCP
